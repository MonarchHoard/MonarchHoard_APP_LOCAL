<!DOCTYPE html>
<html lang="it">
<head>
	<link rel="icon" href="/static/wallpaper/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ===== PWA / Aggiungi a Home ===== -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#05020d">

    <!-- iOS Safari: apri a schermo intero come app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monarch Hoard">

    <!-- Icona sulla Home di iPhone (180x180 consigliata) -->
    <link rel="apple-touch-icon" href="/static/wallpaper/icon-180.png">
    <!-- ===== fine PWA ===== -->

    <title>Login - Monarch Hoard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">

    <div class="login-panel">
        <div class="login-logo">
            <img src="/static/wallpaper/logo_monarchhoard.png" alt="Logo Monarch Hoard">
        </div>

        <!-- Sostituito il testo con l'immagine del titolo -->
        <h1>
            <img src="/static/wallpaper/Scritta_MonarchHoard.png" alt="Monarch Hoard">
        </h1>
        
        <p class="login-subtitle">Accesso Hunter</p>

		{% if success %}
			<div class="login-error" style="background:rgba(77,255,155,0.12); border-color:rgba(77,255,155,0.35); color:#9bffcb;">
				{{ success }}
			</div>
		{% endif %}
		{% if error %}
			<div class="login-error">{{ error }}</div>
		{% endif %}

        <form method="POST" class="login-form">
            <input type="email" name="username" placeholder="Email" autocomplete="email" aria-label="Email" required>
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>

            <button type="submit">Entra</button>
        </form>

		<div class="login-hint">
			Non hai un account? 
			<a href="{{ url_for('register') }}">Registrati qui</a>
		</div>


    </div>

</body>
</html>
