<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="icon" href="/static/wallpaper/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ===== PWA / Aggiungi a Home ===== -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#05020d">

    <!-- iOS Safari: apri a schermo intero come app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monarch Hoard">

    <!-- Icona sulla Home di iPhone (180x180 consigliata) -->
    <link rel="apple-touch-icon" href="/static/wallpaper/icon-180.png">
    <!-- ===== fine PWA ===== -->

    <title>Memory - Monarch Hoard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<script src="/static/js/mobile-menu.js"></script>
<body>
<div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-logo">
                <img src="/static/wallpaper/logo_monarchhoard.png" alt="Monarch Hoard Logo">
                <img class="sidebar-wordmark" src="/static/wallpaper/Scritta_MonarchHoard.png" alt="Monarch Hoard">
            </div>
            <button id="sidebar-pin-btn" class="sidebar-pin-btn" type="button" title="Fissa/comprimi il menu" aria-label="Fissa/comprimi il menu">&#128204;</button>
        </div>
        <div class="sidebar-profile">
            <div class="topbar-player">
                <div class="topbar-player-info">
                    <div class="player-name">Hunter</div>
                    <div class="player-rank">Memory Mode</div>
                </div>
                <div class="player-avatar"></div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <button class="side-nav-btn" onclick="location.href='/'">
                <img class="side-nav-icon" src="/static/wallpaper/symbols_leftbar_collection.png">
                <span>Collezione</span>
            </button>

            <button class="side-nav-btn active">
                <img class="side-nav-icon" src="/static/wallpaper/symbols_leftbar_memory.png">
                <span>Memory</span>
            </button>

            <button class="side-nav-btn" onclick="location.href='/games/quiz'">
                <img class="side-nav-icon" src="/static/wallpaper/symbols_leftbar_cardquiz.png">
                <span>Indovina la Carta</span>
            </button>
			
            <button class="side-nav-btn" onclick="location.href='/games/leaderboard'">
                <img class="side-nav-icon" src="/static/wallpaper/symbols_leftbar_leaderboard.png">
                <span>Classifiche</span>
            </button>
        </nav>
        <a href="{{ url_for('logout') }}" class="sidebar-logout-link">
            <span class="sidebar-logout-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </span>
            <span class="sidebar-logout-text">Logout</span>
        </a>
    </aside>
    <div class="main-content">
        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="top-bar-left">
                <img src="/static/wallpaper/Solo_Leveling_Title.png" class="top-bar-img" alt="Solo Leveling Title">
            </div>
            <div class="top-bar-right"></div>
        </div>

        <main class="main-area">

            <!-- BARRA CONTROLLI -->
            <section class="search-bar">
                <div class="filters-row">

                    <div class="dropdown-filter">
                        <button id="difficulty-button" class="dropdown-button" onclick="toggleDropdown('difficulty-dropdown')">
                            Difficolta': Normale &#9660;
                        </button>
                        <div id="difficulty-dropdown" class="dropdown-content">
                            <div class="filter-chip" onclick="setDifficulty(event, 6, 'Facile')">Facile &middot; 6 coppie</div>
                            <div class="filter-chip active" onclick="setDifficulty(event, 8, 'Normale')">Normale &middot; 8 coppie</div>
                            <div class="filter-chip" onclick="setDifficulty(event, 12, 'Difficile')">Difficile &middot; 12 coppie</div>
                            <div class="filter-chip" onclick="setDifficulty(event, 18, 'Monarca')">Monarca &middot; 18 coppie</div>
                        </div>
                    </div>

                    <button id="btn-new-game" class="set-toggle-btn" onclick="startGame()">Nuova partita</button>
                    <button id="btn-pause" class="game-ctrl-btn" onclick="togglePause()" disabled>Pausa</button>
                    <button id="btn-stop" class="game-ctrl-btn danger" onclick="stopGame()" disabled>Ferma</button>

                    <div class="memory-hud">
                        <div class="memory-hud-item">
                            <span class="memory-hud-label">Mosse</span>
                            <span class="memory-hud-value" id="memory-moves">0</span>
                        </div>
                        <div class="memory-hud-item">
                            <span class="memory-hud-label">Tempo</span>
                            <span class="memory-hud-value" id="memory-time">00:00</span>
                        </div>
                        <div class="memory-hud-item">
                            <span class="memory-hud-label">Coppie</span>
                            <span class="memory-hud-value" id="memory-pairs">0 / 0</span>
                        </div>
                        <div class="memory-hud-item">
                            <span class="memory-hud-label">Record</span>
                            <span class="memory-hud-value" id="memory-best">&mdash;</span>
                        </div>
                    </div>

                </div>
            </section>

            <!-- TAVOLO DI GIOCO -->
            <div class="game-area">
                <div id="memory-board" class="memory-board"></div>

                <!-- Schermata iniziale / pausa -->
                <div id="game-overlay" class="game-overlay">
                    <div class="game-overlay-inner">
                        <div class="game-overlay-icon" id="overlay-icon">&#9670;</div>
                        <h2 id="overlay-title">Memory</h2>
                        <p id="overlay-text">Scegli la difficolta' e premi Nuova partita per iniziare.</p>
                        <button id="overlay-btn" class="overlay-action-btn" onclick="startGame()">Nuova partita</button>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- MODALE VITTORIA -->
<div id="memory-win" class="modal">
    <div class="modal-content memory-win-content">
        <h2>Dungeon Completato</h2>
        <p id="memory-win-stats"></p>
        <div id="memory-win-record" class="memory-record-badge" style="display:none;">NUOVO RECORD</div>
        <div class="modal-footer">
            <button class="close-btn" onclick="closeWinModal()">Chiudi</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script src="/static/js/memory.js"></script>
</body>
</html>
