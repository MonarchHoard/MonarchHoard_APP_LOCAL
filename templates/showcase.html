<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="icon" href="/static/wallpaper/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#05020d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monarch Hoard">
    <link rel="apple-touch-icon" href="/static/wallpaper/icon-180.png">
    <title>Vetrina - Monarch Hoard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="/static/wallpaper/logo_monarchhoard.png" alt="Monarch Hoard Logo">
            <img class="sidebar-wordmark" src="/static/wallpaper/Scritta_MonarchHoard.png" alt="Monarch Hoard">
        </div>
        <nav class="sidebar-nav">
            <button class="side-nav-btn" onclick="location.href='/'">
                <img class="side-nav-icon" src="/static/wallpaper/symbols_leftbar_collection.png">
                <span>Collezione</span>
            </button>
            <button class="side-nav-btn active">
                <img class="side-nav-icon" src="/static/wallpaper/symbols_leftbar_vetrina.png">
                <span>Vetrina</span>
            </button>
            <button class="side-nav-btn" onclick="location.href='/games/memory'">
                <img class="side-nav-icon" src="/static/wallpaper/symbols_leftbar_memory.png">
                <span>Memory</span>
            </button>
            <button class="side-nav-btn" onclick="location.href='/games/quiz'">
                <img class="side-nav-icon" src="/static/wallpaper/symbols_leftbar_cardquiz.png">
                <span>Indovina la Carta</span>
            </button>
            <button class="side-nav-btn" onclick="location.href='/games/leaderboard'">
                <img class="side-nav-icon" src="/static/wallpaper/symbols_leftbar_leaderboard.png">
                <span>Classifiche</span>
            </button>
        </nav>
        <div class="sidebar-player">
            <div class="player-avatar"></div>
            <div>
                <div class="player-name">Hunter</div>
                <div class="player-rank">Vetrina Personale</div>
            </div>
        </div>
    </aside>
    <div class="main-content">
        <div class="top-bar">
            <div class="top-bar-left">
                <img src="/static/wallpaper/Solo_Leveling_Title.png" class="top-bar-img" alt="Solo Leveling Title">
            </div>
            <div class="top-bar-right">
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </div>
        </div>
        <main class="main-area">
            <section class="search-bar">
                <div class="filters-row">
                    <div class="showcase-title-block">
                        <div class="showcase-title">La Tua Vetrina</div>
                        <div class="showcase-subtitle">Le carte migliori della tua collezione, in mostra.</div>
                    </div>
                    <div class="memory-hud">
                        <div class="memory-hud-item">
                            <span class="memory-hud-label">Slot occupati</span>
                            <span class="memory-hud-value" id="showcase-count">0 / 9</span>
                        </div>
                    </div>
                </div>
            </section>
            <div class="showcase-frame">
                <div id="showcase-grid" class="showcase-grid"></div>
            </div>
            <p class="showcase-hint">Aggiungi carte alla vetrina dalla tua Collezione, aprendo una carta posseduta e premendo "+ Vetrina".</p>
        </main>
    </div>
</div>
<div id="toast-container"></div>
<script src="/static/js/showcase.js"></script>
</body>
</html>
